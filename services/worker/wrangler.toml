name = "your-rag-worker"
main = "src/index.ts"
compatibility_date = "2026-08-20"

[vars]
GEMINI_EMBEDDING_MODEL = "your-embedding-model"
GEMINI_GENERATION_MODEL = "your-generation-model"
CORS_ORIGIN = ""

[[d1_databases]]
binding = "DB"
database_name = "your-d1-database"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[vectorize]]
binding = "VECTORIZE"
index_name = "your-vectorize-index"
